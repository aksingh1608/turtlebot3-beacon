<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Beacon architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c5cab"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #1c5cab; stroke-width: 1.5; }
    .sub { fill: #eef3fb; stroke: #1c5cab; stroke-width: 1; }
    .title { font-size: 13px; font-weight: bold; fill: #0b0b0b; }
    .label { fill: #0b0b0b; }
    .topic { font-size: 11px; fill: #1c5cab; }
    .arrow { stroke: #1c5cab; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .file { fill: #ffffff; stroke: #52514e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .muted { fill: #52514e; font-size: 11px; }
  </style>
  <rect width="900" height="420" fill="#fcfcfb"/>

  <!-- spawn_marker -->
  <rect class="box" x="40" y="20" width="170" height="44" rx="4"/>
  <text class="title" x="125" y="47" text-anchor="middle">spawn_marker</text>

  <!-- Gazebo -->
  <rect class="box" x="40" y="110" width="170" height="240" rx="4"/>
  <text class="title" x="125" y="132" text-anchor="middle">Gazebo Classic</text>
  <text class="muted" x="125" y="147" text-anchor="middle">TurtleBot3 Waffle Pi</text>
  <rect class="sub" x="55" y="160" width="140" height="30" rx="3"/>
  <text class="label" x="125" y="180" text-anchor="middle">camera</text>
  <rect class="sub" x="55" y="200" width="140" height="30" rx="3"/>
  <text class="label" x="125" y="220" text-anchor="middle">LiDAR</text>
  <rect class="sub" x="55" y="240" width="140" height="30" rx="3"/>
  <text class="label" x="125" y="260" text-anchor="middle">odom</text>
  <rect class="sub" x="55" y="280" width="140" height="30" rx="3"/>
  <text class="label" x="125" y="300" text-anchor="middle">diff drive (cmd_vel)</text>

  <!-- spawn_marker to Gazebo -->
  <path class="arrow" d="M 125 64 L 125 108"/>
  <text class="topic" x="132" y="90">/reset_world, /delete_entity, /spawn_entity</text>

  <!-- nodes -->
  <rect class="box" x="370" y="150" width="170" height="44" rx="4"/>
  <text class="title" x="455" y="177" text-anchor="middle">detector_node</text>

  <rect class="box" x="370" y="250" width="170" height="44" rx="4"/>
  <text class="title" x="455" y="277" text-anchor="middle">controller_node</text>

  <rect class="box" x="370" y="340" width="170" height="44" rx="4"/>
  <text class="title" x="455" y="367" text-anchor="middle">trial_logger_node</text>

  <!-- camera to detector -->
  <path class="arrow" d="M 195 175 L 368 172"/>
  <text class="topic" x="215" y="166">/camera/image_raw</text>

  <!-- LiDAR to controller -->
  <path class="arrow" d="M 195 215 L 368 262"/>
  <text class="topic" x="230" y="232">/scan</text>

  <!-- controller to Gazebo cmd_vel -->
  <path class="arrow" d="M 368 285 L 197 295"/>
  <text class="topic" x="240" y="308">/cmd_vel</text>

  <!-- odom to logger -->
  <path class="arrow" d="M 195 255 L 368 355"/>
  <text class="topic" x="215" y="330">/odom, /scan</text>

  <!-- detector to controller -->
  <path class="arrow" d="M 455 194 L 455 248"/>
  <text class="topic" x="462" y="225">/beacon/target</text>

  <!-- controller to logger -->
  <path class="arrow" d="M 455 294 L 455 338"/>
  <text class="topic" x="462" y="320">/beacon/state, /cmd_vel</text>

  <!-- detector target also to logger: side line -->
  <path class="arrow" d="M 540 180 C 600 180 600 350 542 355"/>
  <text class="topic" x="575" y="268">/beacon/target</text>

  <!-- spawn_marker trial id to controller and logger -->
  <path class="arrow" d="M 210 42 C 330 42 330 265 368 268"/>
  <text class="topic" x="235" y="60">/beacon/trial</text>

  <!-- CSV files, top right -->
  <rect class="file" x="690" y="20" width="190" height="104" rx="4"/>
  <text class="title" x="785" y="42" text-anchor="middle">trials/</text>
  <text class="label" x="705" y="62">positions.csv</text>
  <text class="label" x="705" y="80">logs/trial_N.csv</text>
  <text class="label" x="705" y="98">results.csv</text>
  <text class="label" x="705" y="116" font-size="11">current_trial.json</text>
  <path class="arrow" d="M 210 34 L 688 34"/>
  <text class="topic" x="450" y="28" text-anchor="middle">reads positions.csv, writes current_trial.json</text>
  <path class="arrow" d="M 540 375 L 860 375 L 860 126"/>
  <text class="topic" x="700" y="367" text-anchor="middle">rows at log_hz to logs/ and results.csv</text>

  <!-- RViz, right middle -->
  <rect class="box" x="690" y="200" width="140" height="60" rx="4"/>
  <text class="title" x="760" y="225" text-anchor="middle">RViz</text>
  <text class="muted" x="760" y="245" text-anchor="middle">config/beacon.rviz</text>
  <path class="arrow" d="M 540 165 L 688 215"/>
  <text class="topic" x="600" y="178">/beacon/debug_image</text>
  <path class="arrow" d="M 540 350 L 688 248"/>
  <text class="topic" x="640" y="316">/beacon/path</text>

  <text class="muted" x="40" y="400">Arrows carry ROS 2 topics unless marked as services or files. Trial id on /beacon/trial uses transient local QoS.</text>
</svg>
